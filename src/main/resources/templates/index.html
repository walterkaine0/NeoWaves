<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoWaves | Spotify Aero Edition</title>
    <script src="https://tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">


    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="app-container" style="display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 90px); overflow: hidden;">

    <!-- САЙДБАР -->
    <aside class="sidebar" style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border-right: 1px solid rgba(255, 255, 255, 0.1); width: 260px; height: 100vh; padding: 20px; display: flex; flex-direction: column;">
        <div style="font-size: 24px; font-weight: 900; font-style: italic; margin-bottom: 30px;">NeoWaves</div>

        <nav style="display: flex; flex-direction: column; gap: 10px;">
            <div class="menu-item active" onclick="location.reload()" style="padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.1); cursor: pointer;">🏠 Главная</div>
            <div class="menu-item" style="padding: 10px; opacity: 0.6; cursor: pointer;">🔍 Поиск</div>
        </nav>

        <div style="margin-top: 30px;">
            <p style="font-size: 11px; opacity: 0.5; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px;">ПЛЕЙЛИСТЫ</p>
            <div id="playlists-container" style="display: flex; flex-direction: column; gap: 8px;">
                <!-- Твоя рабочая логика из nonstab -->
                <div th:each="pl : ${playlists}" class="playlist-item"
                     th:onclick="|openPlaylist(${pl.id})|"
                     style="padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s;">
                    <span th:text="${pl.name == 'Favorites' ? '💎 ' + pl.name : '💿 ' + pl.name}"></span>
                    <button th:if="${pl.name != 'Favorites'}" th:onclick="|handleDeletePlaylist(${pl.id})|" style="background:none; border:none; color:rgba(255,255,255,0.3); cursor:pointer;">×</button>
                </div>
            </div>
            <button onclick="handleCreatePlaylist()" style="width: 100%; margin-top: 15px; padding: 10px; border-radius: 20px; border: none; background: white; color: #0072ff; font-weight: bold; cursor: pointer;">+ Создать</button>
        </div>
    </aside>

    <!-- ОСНОВНОЙ КОНТЕНТ (Сетка песен) -->
    <main class="main-content">
        <header style="width: 100%; display: flex; justify-content: flex-end; padding: 20px 40px; box-sizing: border-box;">
            <div id="auth-section" style="display: flex; align-items: center; gap: 15px;">
                <span id="user-name" style="color: white; font-weight: bold; font-size: 14px;"></span>
                <button id="login-btn" onclick="handleLogin()" style="background: rgba(255,255,255,0.1); border: 1px solid white; color: white; padding: 8px 25px; border-radius: 20px; cursor: pointer; backdrop-filter: blur(10px);">Войти</button>
                <button id="logout-btn" onclick="handleLogout()" style="display:none; background: none; border: none; color: white; opacity: 0.7; cursor: pointer;">Выйти</button>
            </div>
        </header>

        <section class="content">
            <div id="content-grid" class="album-grid">
                <!-- Сюда Thymeleaf рендерит песни при загрузке, а JS — при выборе плейлиста -->
                <div th:each="song, iter : ${songs}" th:if="${song != null}" class="album-card">
                    <div th:onclick="|playSpecific(${iter.index})|">
                        <img th:src="${song.album?.coverUrl ?: '/img/default.png'}" alt="Cover">
                        <h4 th:text="${song.title ?: 'Untitled'}"></h4>
                        <p th:text="${song.album?.artist?.name ?: 'Unknown'}"></p>
                    </div>

                    <!-- Добавление в плейлист -->
                    <select class="add-to-pl" th:onchange="|addToPlaylist(this.value, ${song.id})|">
                        <option value="">+ В плейлист</option>
                        <option th:each="pl : ${playlists}" th:if="${pl != null}"
                                th:value="${pl.id}" th:text="${pl.name}"></option>
                    </select>
                </div>
            </div>
        </section>
    </main>
</div>


<audio id="main-audio"></audio>
<footer class="music-player" style="position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px); border-top: 1px solid rgba(255, 255, 255, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; box-sizing: border-box; z-index: 9999; color: white;">

    <!-- Лево: Инфо -->
    <div style="width: 25%; display: flex; align-items: center; gap: 15px;">
        <div id="mini-cover" style="width: 56px; height: 56px; border-radius: 8px; background: rgba(255,255,255,0.2); background-size: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3);"></div>
        <div style="overflow: hidden;">
            <p id="track-title" style="margin: 0; font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Выберите трек</p>
            <p id="artist-name" style="margin: 0; font-size: 12px; opacity: 0.6;">...</p>
        </div>
    </div>

    <!-- Центр: Управление -->
    <div style="width: 50%; display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 30px;">
            <button onclick="prevTrack()" style="background: none; border: none; color: white; cursor: pointer; font-size: 20px;">⏮</button>
            <div id="play-btn" onclick="togglePlay()" style="width: 46px; height: 46px; background: radial-gradient(circle at 30% 30%, #ffffff 0%, #dcdcdc 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #0072ff; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-size: 18px;">▶</div>
            <button onclick="nextTrack()" style="background: none; border: none; color: white; cursor: pointer; font-size: 20px;">⏭</button>
        </div>
        <div style="width: 100%; display: flex; align-items: center; gap: 12px; font-size: 11px;">
            <span id="current-time">0:00</span>
            <div id="progress-container" style="flex-grow: 1; height: 5px; background: rgba(255, 255, 255, 0.2); border-radius: 5px; cursor: pointer; position: relative; overflow: hidden;">
                <div id="progress-fill" style="height: 100%; width: 0%; background: #00fff2; box-shadow: 0 0 10px #00fff2; transition: width 0.1s linear;"></div>
            </div>
            <span id="total-time">0:00</span>
        </div>
    </div>

    <!-- Право: Лайк -->
    <div style="width: 25%; display: flex; justify-content: flex-end;">
        <button onclick="handleLike()" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">❤</button>
    </div>
</footer>

<script th:inline="javascript">

// --- 2. Массив песен (Thymeleaf) ---
// 1. Формируем массив песен из Spring Model
    let songs = [];
    /*[# th:each="s : ${songs}"]*/
        /*[# th:if="${s != null}"]*/
        songs.push({
            id: [[${s?.id}]],
            title: [[${s?.title ?: 'Без названия'}]],
            s3Url: [[${s?.s3Url ?: ''}]],
            coverUrl: [[${s?.album?.coverUrl ?: ''}]],
            artist: [[${s?.album?.artist?.name ?: 'Неизвестен'}]]
        });
        /*[/]*/
    /*[/]*/
    let currentIndex = 0;
    const audio = document.getElementById('main-audio');
    const playBtn = document.getElementById('play-btn');

    // 2. Функции плеера
    function loadTrack(index) {
        if (songs.length === 0) return;
        const s = songs[index];
        document.getElementById('track-title').innerText = s.title;
        document.getElementById('artist-name').innerText = s.artist;
        document.getElementById('mini-cover').style.backgroundImage = `url('${s.coverUrl}')`;
        audio.src = s.s3Url;
    }

    // Вызываем загрузку первого трека, если они есть
    if (songs.length > 0) { loadTrack(0); }

    window.playSpecific = (i) => { currentIndex = i; loadTrack(i); audio.play(); playBtn.innerText = "⏸"; };
    window.togglePlay = function() {
        if (songs.length === 0) return;
        if (!audio.src) loadTrack(currentIndex);

        if (audio.paused) {
            audio.play();
            playBtn.innerText = "⏸";
        } else {
            audio.pause();
            playBtn.innerText = "▶";
        }
    };
    window.nextTrack = function() {
        if (songs.length === 0) return;
        currentIndex = (currentIndex + 1) % songs.length;
        loadTrack(currentIndex);
        audio.play();
        playBtn.innerText = "⏸";
    };

    window.prevTrack = function() {
        if (songs.length === 0) return;
        currentIndex = (currentIndex - 1 + songs.length) % songs.length;
        loadTrack(currentIndex);
        audio.play();
        playBtn.innerText = "⏸";
    };

    // 3. Таймбар и прогресс
    audio.ontimeupdate = () => {
        if (audio.duration) {
            const pct = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress-fill').style.width = pct + '%';
            document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        }
    };

    document.getElementById('progress-container').onclick = (e) => {
        const width = e.currentTarget.clientWidth;
        const clickX = e.offsetX;
        audio.currentTime = (clickX / width) * audio.duration;
    };

    function formatTime(s) {
        let min = Math.floor(s / 60);
        let sec = Math.floor(s % 60);
        return min + ":" + (sec < 10 ? '0' + sec : sec);
    }

    // 4. Заглушки для функций плейлиста (чтобы консоль не ругалась)
    window.openPlaylist = (id) => { console.log("Open playlist", id); };
    window.handleDeletePlaylist = (id) => { console.log("Delete playlist", id); };
// --- 4. Восстановление Firebase функций ---
    const firebaseConfig = {
        apiKey: "AIzaSyDJhWJDrW-rN2a3zFp_hAL5EWFn5UT9B28",
        authDomain: "neowaves-824c3.firebaseapp.com",
        projectId: "neowaves-824c3",
        storageBucket: "neowaves-824c3.firebasestorage.app",
        messagingSenderId: "398266414799",
        appId: "1:398266414799:web:f58c71fe879b531f8b29ba"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    window.handleLogin = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    // Мы используем только Popup, так как Redirect на localhost часто капризничает
    auth.signInWithPopup(provider)
        .then((result) => {
            console.log("Вход выполнен успешно!", result.user.displayName);
        })
        .catch((error) => {
            console.error("Ошибка входа:", error.message);
            alert("Не удалось открыть окно входа. Проверьте, не заблокированы ли всплывающие окна.");
        });
};

    window.handleLogout = () => {
    auth.signOut().then(() => {
        // Перенаправляем на чистый URL без параметров, чтобы контроллер не нашел email
        window.location.href = window.location.pathname;
    });
};

    window.handleLike = () => {
        const u = auth.currentUser;
        if(!u) return alert("Войдите в аккаунт!");
        fetch(`/like/${songs[currentIndex].id}?userEmail=${u.email}`, {method:'POST'})
            .then(r => r.text()).then(m => alert(m));
    };

    window.addToPlaylist = (playlistId, songId) => {
    if (!playlistId) return;

    fetch(`/playlist/${playlistId}/add/${songId}`, { method: 'POST' })
        .then(r => r.text())
        .then(message => {
            alert(message);
            // Сбрасываем селект в исходное состояние
            location.reload();
        });
};

    window.handleCreatePlaylist = () => {
        const u = auth.currentUser;
        if(!u) return alert("Войдите в аккаунт!");
        const n = prompt("Название плейлиста:");
        if(n) fetch(`/playlist/create?name=${encodeURIComponent(n)}&userEmail=${u.email}`, {method:'POST'})
            .then(r => {
                if(r.ok) location.reload(); // Перезагрузка страницы
                else alert("Ошибка создания");
            });
    };

    auth.onAuthStateChanged((user) => {
        if (user) {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('userEmail')) {
            window.location.search = `userEmail=${user.email}`;
            }
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'inline-block';
            document.getElementById('user-name').innerText = user.displayName;
            fetch('/api/auth/sync', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user.displayName, email: user.email})
            });
        }
    });


    // ФУНКЦИЯ ОТКРЫТИЯ ПЛЕЙЛИСТА
    window.openPlaylist = (id) => {
    fetch(`/playlist/${id}/songs`)
        .then(r => r.json())
        .then(data => {
            if (data.length === 0) return alert("Плейлист пуст");

            // 1. Обновляем текущий список песен
            songs = data.map(s => ({
                id: s.id,
                title: s.title,
                s3Url: s.s3Url,
                coverUrl: s.album ? s.album.coverUrl : '',
                artist: (s.album && s.album.artist) ? s.album.artist.name : 'Unknown'
            }));

            // 2. Перерисовываем интерфейс (сетку)
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';

            songs.forEach((s, index) => {
                const card = document.createElement('div');
                card.className = 'album-card';
                // Теперь клик для проигрывания вешаем на обертку контента, а не на всю карту
                card.innerHTML = `
                    <div class="card-clickable" onclick="playSpecific(${index})">
                        <img src="${s.coverUrl}" alt="Cover">
                        <h4>${s.title}</h4>
                        <p>${s.artist}</p>
                    </div>
                    <button class="remove-btn" onclick="removeFromPlaylist(${id}, ${s.id})">
                        🗑 Удалить
                    </button>
                `;
                grid.appendChild(card);
            });

            loadTrack(0);
        })
        .catch(err => console.error("Ошибка загрузки плейлиста:", err));
};

    window.handleDeletePlaylist = (id) => {
    if (!confirm("Вы действительно хотите удалить этот плейлист?")) return;

    fetch(`/playlist/delete/${id}`, { method: 'POST' })
        .then(r => {
            if (r.ok) location.reload(); // Перезагружаем, чтобы обновить сайдбар
            else alert("Ошибка при удалении");
        });
};
    window.removeFromPlaylist = (playlistId, songId) => {
    if(!confirm("Удалить этот трек из плейлиста?")) return;

    fetch(`/playlist/${playlistId}/remove/${songId}`, { method: 'POST' })
        .then(r => r.text())
        .then(msg => {
            console.log(msg);
            openPlaylist(playlistId); // Обновляем вид плейлиста
        })
        .catch(err => alert("Ошибка при удалении"));
};

    window.handleLogin = () => console.log("Firebase инициализируется...");
    window.handleLogout = () => {};
    window.handleLike = () => alert("Войдите в аккаунт");
    window.handleCreatePlaylist = () => alert("Войдите в аккаунт");

    if (songs.length > 0) loadTrack(0);



</script>


</body>
</html>
