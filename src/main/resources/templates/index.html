<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoWaves | Spotify Aero Edition</title>
    <script src="https://tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://jsdelivr.net" rel="stylesheet">


    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
</head>
<body>
<audio id="main-audio"></audio>
<footer class="music-player" style="position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px); border-top: 1px solid rgba(255, 255, 255, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; box-sizing: border-box; z-index: 9999; color: white;">

    <!-- Лево: Инфо -->
    <div style="width: 25%; display: flex; align-items: center; gap: 15px;">
        <div id="mini-cover" style="width: 56px; height: 56px; border-radius: 8px; background: rgba(255,255,255,0.2); background-size: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3);"></div>
        <div style="overflow: hidden;">
            <p id="track-title" style="margin: 0; font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Выберите трек</p>
            <p id="artist-name" style="margin: 0; font-size: 12px; opacity: 0.6;">...</p>
        </div>
    </div>

    <!-- Центр: Управление -->
    <div style="width: 50%; display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 30px;">
            <button onclick="prevTrack()" style="background: none; border: none; color: white; cursor: pointer; font-size: 20px;">⏮</button>
            <div id="play-btn" onclick="togglePlay()" style="width: 46px; height: 46px; background: radial-gradient(circle at 30% 30%, #ffffff 0%, #dcdcdc 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #0072ff; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-size: 18px;">▶</div>
            <button onclick="nextTrack()" style="background: none; border: none; color: white; cursor: pointer; font-size: 20px;">⏭</button>
        </div>
        <div style="width: 100%; display: flex; align-items: center; gap: 12px; font-size: 11px;">
            <span id="current-time">0:00</span>
            <div id="progress-container" style="flex-grow: 1; height: 5px; background: rgba(255, 255, 255, 0.2); border-radius: 5px; cursor: pointer; position: relative; overflow: hidden;">
                <div id="progress-fill" style="height: 100%; width: 0%; background: #00fff2; box-shadow: 0 0 10px #00fff2; transition: width 0.1s linear;"></div>
            </div>
            <span id="total-time">0:00</span>
        </div>
    </div>

    <!-- Право: Лайк -->
    <div style="width: 25%; display: flex; justify-content: flex-end;">
        <button onclick="handleLike()" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">❤</button>
    </div>
</footer>

<script>
    const audio = document.getElementById('main-audio');

    // Функция обновления таймбара
    if (audio) {
        audio.ontimeupdate = () => {
            if (audio.duration) {
                const pFill = document.getElementById('progress-fill');
                const curTime = document.getElementById('current-time');
                const pct = (audio.currentTime / audio.duration) * 100;

                if (pFill) pFill.style.width = pct + '%';
                if (curTime) curTime.innerText = formatTime(audio.currentTime);
            }
        };

        audio.onloadedmetadata = () => {
            const totalTime = document.getElementById('total-time');
            if (totalTime) totalTime.innerText = formatTime(audio.duration);
        };
    }

    // Перемотка
    const pContainer = document.getElementById('progress-container');
    if (pContainer) {
        pContainer.onclick = (e) => {
            const width = pContainer.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        };
    }

    function formatTime(s) {
        let min = Math.floor(s / 60);
        let sec = Math.floor(s % 60);
        return min + ":" + (sec < 10 ? '0' + sec : sec);
    }
</script>


</body>
</html>
