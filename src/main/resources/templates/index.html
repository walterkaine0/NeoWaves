<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waves</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">


    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

</head>
<body>
<div class="app-container" style="display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 90px); overflow: hidden;">

    <!-- САЙДБАР -->
    <aside class="sidebar" style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border-right: 1px solid rgba(255, 255, 255, 0.1); width: 260px; height: 100vh; padding: 20px; display: flex; flex-direction: column;">
        <div style="font-size: 24px; font-weight: 900; font-style: italic; margin-bottom: 30px;">Waves</div>

        <nav style="display: flex; flex-direction: column; gap: 10px;">
            <div class="menu-item active" onclick="location.reload()" style="padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.1); cursor: pointer;">🏠 Главная</div>
            <div class="menu-item" style="padding: 10px; opacity: 0.6; cursor: pointer;">🔍 Поиск</div>
        </nav>

        <div style="margin-top: 30px;">
            <p style="font-size: 11px; opacity: 0.5; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px;">ПЛЕЙЛИСТЫ</p>
            <!-- ПУСТОЙ КОНТЕЙНЕР БЕЗ th:each -->
            <div id="playlists-container" style="display: flex; flex-direction: column; gap: 8px;">
                <!-- ЗДЕСЬ ДОЛЖНО БЫТЬ ПУСТО. Удали весь код th:each и внутренние div -->
            </div>
            <!-- Добавь ID кнопке, чтобы JS мог её прятать -->
            <button id="create-playlist-btn" onclick="handleCreatePlaylist()" style="display: none; width: 100%; margin-top: 15px; padding: 10px; border-radius: 20px; border: none; background: white; color: #0072ff; font-weight: bold; cursor: pointer;">
                + Создать
            </button>
        </div>
    </aside>

    <!-- ОСНОВНОЙ КОНТЕНТ (Сетка песен) -->
    <main class="main-content">
        <header style="width: 100%; display: flex; justify-content: flex-end; padding: 20px 40px; box-sizing: border-box;">
            <div id="auth-section" style="display: flex; align-items: center; gap: 15px;">
                <span id="user-name" style="color: white; font-weight: bold; font-size: 14px;"></span>
                <button id="login-btn" onclick="handleLogin()" style="background: rgba(255,255,255,0.1); border: 1px solid white; color: white; padding: 8px 25px; border-radius: 20px; cursor: pointer;">Войти</button>
                <button id="logout-btn" onclick="handleLogout()" style="display: none; background: none; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 25px; border-radius: 20px; cursor: pointer;">Выйти</button>
            </div>
        </header>

        <section class="content">
            <div id="content-grid" class="album-grid">
                <!-- Сюда Thymeleaf рендерит песни при загрузке, а JS — при выборе плейлиста -->
                <div th:each="song, iter : ${songs}" th:if="${song != null}" class="album-card">
                    <div th:onclick="|playSpecific(${iter.index})|">
                        <img th:src="${song.album?.coverUrl ?: '/img/default.png'}" alt="Cover">
                        <h4 th:text="${song.title ?: 'Untitled'}"></h4>
                        <p th:text="${song.album?.artist?.name ?: 'Unknown'}"></p>
                    </div>

                    <!-- Добавление в плейлист -->
                    <!-- Контейнер для кнопок "+ В плейлист", тоже пустой -->
                    <div class="playlist-selector-container" th:attr="data-song-id=${song.id}"></div>

                </div>
            </div>
        </section>
    </main>
</div>


<audio id="main-audio"></audio>
<footer class="music-player" style="position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px); border-top: 1px solid rgba(255, 255, 255, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; box-sizing: border-box; z-index: 9999; color: white;">

    <!-- Лево: Инфо -->
    <div style="width: 25%; display: flex; align-items: center; gap: 15px;">
        <div id="mini-cover" style="width: 56px; height: 56px; border-radius: 8px; background: rgba(255,255,255,0.2); background-size: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3);"></div>
        <div style="overflow: hidden;">
            <p id="track-title" style="margin: 0; font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Выберите трек</p>
            <p id="artist-name" style="margin: 0; font-size: 12px; opacity: 0.6;">...</p>
        </div>
    </div>

    <!-- Центр: Управление -->
    <div style="width: 50%; display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 30px;">
            <button onclick="prevTrack()" style="background: none; border: none; color: white; cursor: pointer; font-size: 20px;">⏮</button>
            <div id="play-btn" onclick="togglePlay()" style="width: 46px; height: 46px; background: radial-gradient(circle at 30% 30%, #ffffff 0%, #dcdcdc 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #0072ff; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); font-size: 18px;">▶</div>
            <button onclick="nextTrack()" style="background: none; border: none; color: white; cursor: pointer; font-size: 20px;">⏭</button>
        </div>
        <div style="width: 100%; display: flex; align-items: center; gap: 12px; font-size: 11px;">
            <span id="current-time">0:00</span>
            <div id="progress-container" style="flex-grow: 1; height: 5px; background: rgba(255, 255, 255, 0.2); border-radius: 5px; cursor: pointer; position: relative; overflow: hidden;">
                <div id="progress-fill" style="height: 100%; width: 0%; background: #00fff2; box-shadow: 0 0 10px #00fff2; transition: width 0.1s linear;"></div>
            </div>
            <span id="total-time">0:00</span>
        </div>
    </div>

    <!-- Право: Лайк -->
    <div style="width: 25%; display: flex; justify-content: flex-end; align-items: center;">
        <div id="main-like-btn" class="like-btn" onclick="handleLike()" style="font-size: 30px; line-height: 1;">
            ❤
        </div>
    </div>
</footer>

<script th:inline="javascript">
    const API_BASE = 'http://localhost:8081';
    // --- 2. Массив песен (Thymeleaf) ---
    // 1. Формируем массив песен из Spring Model
        let songs = [];
        /*[# th:each="s : ${songs}"]*/
            /*[# th:if="${s != null}"]*/
            songs.push({
                id: [[${s?.id}]],
                title: [[${s?.title ?: 'Без названия'}]],
                s3Url: [[${s?.s3Url ?: ''}]],
                coverUrl: [[${s?.album?.coverUrl ?: ''}]],
                artist: [[${s?.album?.artist?.name ?: 'Неизвестен'}]]
            });
            /*[/]*/
        /*[/]*/
        let currentIndex = null;
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-btn');

        // 2. Функции плеера
        function loadTrack(index) {
    if (songs.length === 0) return;
    const s = songs[index];

    currentIndex = index;
    window.currentTrackId = s.id; // Ключевой момент для работы лайка

    document.getElementById('track-title').innerText = s.title;
    document.getElementById('artist-name').innerText = s.artist;
    document.getElementById('mini-cover').style.backgroundImage = `url('${s.coverUrl}')`;

    // Когда включаем новый трек, убираем красный цвет с кнопки
    const heartBtn = document.getElementById('main-like-btn');
    if (heartBtn) {
        heartBtn.classList.remove('liked');
    }

    audio.src = s.s3Url;
}


        // Вызываем загрузку первого трека, если они есть
        if (songs.length > 0) { loadTrack(0); }



        window.nextTrack = function() {
            if (songs.length === 0) return;
            currentIndex = (currentIndex + 1) % songs.length;
            loadTrack(currentIndex);
            audio.play();
            playBtn.innerText = "⏸";
        };

        window.prevTrack = function() {
            if (songs.length === 0) return;
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadTrack(currentIndex);
            audio.play();
            playBtn.innerText = "⏸";
        };



        // 3. Таймбар и прогресс
        audio.ontimeupdate = () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progress-fill').style.width = pct + '%';
                document.getElementById('current-time').innerText = formatTime(audio.currentTime);
            }
        };

        document.getElementById('progress-container').onclick = (e) => {
            const width = e.currentTarget.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        };

        function formatTime(s) {
            let min = Math.floor(s / 60);
            let sec = Math.floor(s % 60);
            return min + ":" + (sec < 10 ? '0' + sec : sec);
        }

        // 4. Заглушки для функций плейлиста (чтобы консоль не ругалась)
        window.openPlaylist = (id) => { console.log("Open playlist", id); };
        window.handleDeletePlaylist = (id) => { console.log("Delete playlist", id); };


    // --- 4. Восстановление Firebase функций ---
        document.addEventListener("DOMContentLoaded", () => {

        const firebaseConfig = {
            apiKey: "AIzaSyDJhWJDrW-rN2a3zFp_hAL5EWFn5UT9B28",
              authDomain: "neowaves-824c3.firebaseapp.com",
              projectId: "neowaves-824c3",
              storageBucket: "neowaves-824c3.firebasestorage.app",
              messagingSenderId: "398266414799",
              appId: "1:398266414799:web:f58c71fe879b531f8b29ba",
              measurementId: "G-YS6MJR4KBX"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();



            // 1. Функция входа
        window.handleLogin = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(provider)
        .then((result) => {
            console.log("Успешный вход:", result.user.email);
            // Сразу перезагружаем страницу с email, чтобы Java отдала плейлисты
            window.location.href = "/?userEmail=" + encodeURIComponent(result.user.email);
        })
        .catch((error) => {
            console.error("Ошибка входа:", error);
            // Если попап заблокирован, пробуем редирект как запасной вариант
            firebase.auth().signInWithRedirect(provider);
        });
};


        window.playSpecific = (index) => {
    if (!songs[index]) return;

    currentIndex = index; // КРИТИЧЕСКИ ВАЖНО: теперь handleLike будет знать, какой трек выбран

    const s = songs[index];
    window.currentTrackId = s.id; // Для надежности сохраняем и ID

    document.getElementById('track-title').innerText = s.title;
    document.getElementById('artist-name').innerText = s.artist;
    document.getElementById('mini-cover').style.backgroundImage = `url('${s.coverUrl}')`;
    audio.src = s.s3Url;
    audio.play();
    document.getElementById('play-btn').innerText = "⏸";
};

        window.togglePlay = () => {
            if (!audio.src && songs.length > 0) window.playSpecific(0);
            if (audio.paused) { audio.play(); document.getElementById('play-btn').innerText = "⏸"; }
            else { audio.pause(); document.getElementById('play-btn').innerText = "▶"; }
        };

         window.loadUserPlaylists = (email) => {
        const container = document.getElementById('playlists-container');
        if (!container) return;

        fetch(`/playlist/user?email=${encodeURIComponent(email)}`)
            .then(res => res.json())
            .then(playlists => {
                container.innerHTML = ''; // Чистим перед отрисовкой
                playlists.forEach(pl => {
                    const isFav = pl.name === 'Favorites';
                    const div = document.createElement('div');
                    div.className = 'playlist-item';
                    div.style = "padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center;";
                    div.innerHTML = `
                        <span>${isFav ? '💎' : '💿'} ${pl.name}</span>
                        ${!isFav ? `<button onclick="event.stopPropagation(); handleDeletePlaylist(${pl.id})" style="color: grey; background: none; border: none;">×</button>` : ''}
                    `;
                    div.onclick = () => window.openPlaylist(pl.id);
                    container.appendChild(div);
                });
            });
    };

        window.addSongToPlaylist = (playlistId, songId) => {
        if (!playlistId) return;
        fetch(`/playlist/${playlistId}/add/${songId}`, { method: 'POST' })
            .then(res => res.text())
            .then(msg => showModal(msg, "Плейлист"))
            .catch(err => console.error("Ошибка добавления:", err));
    };

window.renderUserContent = (email) => {
    fetch(`/playlist/user?email=${encodeURIComponent(email)}`)
        .then(res => res.json())
        .then(playlists => {
            // 1. Сайдбар с крестиками
            const container = document.getElementById('playlists-container');
            if (container) {
                container.innerHTML = playlists.map(pl => {
                    const isFav = pl.name.toLowerCase() === 'favorites';
                    return `
                        <div class="playlist-item" onclick="openPlaylist(${pl.id})"
                             style="padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span>${isFav ? '💎' : '💿'} ${pl.name}</span>
                            ${!isFav ? `<button onclick="event.stopPropagation(); handleDeletePlaylist(${pl.id})" style="background:none; border:none; color:rgba(255,255,255,0.4); cursor:pointer; font-size: 20px;">&times;</button>` : ''}
                        </div>
                    `;
                }).join('');
            }

            // 2. Глянцевые кастомные выпадающие списки под треками
            document.querySelectorAll('.playlist-selector-container').forEach(div => {
                const songId = div.getAttribute('data-song-id');
                div.style.display = 'block';

               div.innerHTML = `
                    <div class="custom-dropdown">
                        <div class="dropdown-selected" onclick="window.toggleDropdown(event, this)">
                            + В плейлист <span>▼</span>
                        </div>
                        <div class="dropdown-menu" style="display: none; position: absolute; background: rgba(0,0,0,0.8); z-index: 1000; width: 100%;">
                            ${playlists.map(pl => `
                                <div class="dropdown-item" onclick="window.addSongToPlaylist(${pl.id}, ${songId}); this.parentElement.style.display='none'">
                                    ${pl.name}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
        });
};

// --- 2. Мониторинг состояния (Вход / Выход) ---
// --- ФИНАЛЬНЫЙ МОНИТОРИНГ СОСТОЯНИЯ ---
firebase.auth().onAuthStateChanged(user => {
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userName = document.getElementById('user-name');
    const createBtn = document.getElementById('create-playlist-btn');
    const container = document.getElementById('playlists-container');

    // СНАЧАЛА объявляем переменную, чтобы не было ошибки ReferenceError
    const urlParams = new URLSearchParams(window.location.search);
    const emailInUrl = urlParams.get('userEmail');

    if (user) {
        console.log("Пользователь вошел:", user.email);

        // Синхронизация URL (чтобы Java отдавала данные в модель)
        if (emailInUrl !== user.email) {
            window.location.href = "/?userEmail=" + encodeURIComponent(user.email);
            return;
        }

        // Показываем кнопки и имя
        if (loginBtn) loginBtn.style.setProperty('display', 'none', 'important');
        if (logoutBtn) logoutBtn.style.setProperty('display', 'block', 'important');
        if (userName) userName.innerText = user.displayName || user.email;
        if (createBtn) createBtn.style.display = 'block';

        // ЗАПУСКАЕМ ОТРИСОВКУ КОНТЕНТА
        // Вызываем твои функции для сайдбара и селекторов под треками
        if (typeof window.loadSidebar === 'function') {
            window.loadSidebar();
        }
        if (typeof window.updateAllSelects === 'function') {
            window.updateAllSelects();
        }

        // Синхронизируем сессию с бэкендом
        user.getIdToken(true).then(idToken => {
            fetch('/api/auth/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: idToken,
                    email: user.email,
                    username: user.displayName || user.email.split('@')[0]
                })
            }).then(res => console.log("Сервер подтвердил сессию:", res.ok));
        });

    } else {
        console.log("Пользователь не авторизован. Очистка...");

        // Очищаем всё, чтобы данные не висели после выхода
        if (container) container.innerHTML = '';
        if (createBtn) createBtn.style.display = 'none';
        if (userName) userName.innerText = '';

        // Скрываем и очищаем выпадающие списки под треками
        document.querySelectorAll('.playlist-selector-container').forEach(div => {
            div.innerHTML = '';
            div.style.display = 'none';
        });

        // Если в URL остался email после выхода — уходим на чистую главную
        if (emailInUrl) {
            window.location.href = "/";
            return;
        }

        if (loginBtn) loginBtn.style.setProperty('display', 'block', 'important');
        if (logoutBtn) logoutBtn.style.setProperty('display', 'none', 'important');
    }
});


        // --- 3. Функция выхода ---
        window.handleLogout = () => {
        firebase.auth().signOut().then(() => {
            // Перенаправляем на чистый корень БЕЗ ?userEmail=...
            window.location.href = "/";
        });
    };

        window.handleLike = () => {
    const u = firebase.auth().currentUser;
    if (!u) return showModal("Войдите в аккаунт!");

    // Берем ID трека, который мы сохранили при нажатии Play
    const trackId = window.currentTrackId;
    if (!trackId) return showModal("Сначала выберите трек!");

    const heartBtn = document.getElementById('main-like-btn');

    // Отправка на твой Spring Boot контроллер
    fetch(`/like/${trackId}?userEmail=${encodeURIComponent(u.email)}`, { method: 'POST' })
        .then(r => r.text())
        .then(message => {
            console.log("Ответ сервера:", message);

            // Просто переключаем класс .liked из твоего CSS
            heartBtn.classList.toggle('liked');
        })
        .catch(err => console.error("Ошибка лайка:", err));
};

    const API_BASE = 'http://localhost:8081';
    let globalPlaylists = [];
    let songs = [];
    let trackToDelete = { pId: null, sId: null };



    // 1. Инициализация при загрузке
    window.onload = () => {
        window.loadSidebar();
    };

    window.loadSidebar = () => {
    // 1. Пытаемся получить текущего пользователя из Firebase
    const user = firebase.auth().currentUser;

    // 2. Если пользователя нет — очищаем сайдбар и выходим
    if (!user) {
        const container = document.getElementById('playlists-container');
        if (container) container.innerHTML = '';
        return;
    }

    // 3. Если пользователь есть — берем ЕГО email динамически
    const email = user.email;

    fetch(`${API_BASE}/playlist/user?email=${encodeURIComponent(email)}`)
        .then(res => res.json())
        .then(data => {
            globalPlaylists = data;
            const container = document.getElementById('playlists-container');
            if (container) {
                container.innerHTML = '';
                data.forEach(p => {
                    const isFav = p.name === 'Favorites';
                    const item = document.createElement('div');
                    item.className = 'playlist-item';
                    item.style = "display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 5px 10px;";
                    item.onclick = () => window.openPlaylist(p.id);

                    item.innerHTML = `
                        <span>${isFav ? '💎' : '💿'} ${p.name}</span>
                        ${!isFav ? `
                            <span onclick="window.handleDeletePlaylist(event, ${p.id})"
                                  style="color: rgba(255,255,255,0.5); font-size: 18px; font-weight: bold; padding: 0 5px;">×</span>
                        ` : ''}
                    `;
                    container.appendChild(item);
                });
            }
            window.updateAllSelects();
        });
};

    window.handleCreatePlaylist = () => {
        document.getElementById('playlistModal').style.display = 'flex';
    };

    window.closeModal = () => {
        document.getElementById('playlistModal').style.display = 'none';
    };

    window.confirmCreatePlaylist = () => {
        const name = document.getElementById('newPlaylistName').value;
        const u = firebase.auth().currentUser;
        if (!name) return alert("Введите название!");
        if (!u) return alert("Войдите в аккаунт!");

        fetch(`/playlist/create?name=${encodeURIComponent(name)}&userEmail=${encodeURIComponent(u.email)}`, { method: 'POST' })
            .then(res => res.text())
            .then(msg => {
                alert(msg); // Откроет твою infoModal
                location.reload();
            });
        closePlaylistModal();
    };

    window.closePlaylistModal = () => {
    document.getElementById('playlistModal').style.display = 'none';
};

   window.updateAllSelects = () => {
    const containers = document.querySelectorAll('.playlist-selector-container');
    containers.forEach(container => {
        const songId = container.dataset.songId;

        // Генерируем пункты меню
        const menuItemsHtml = globalPlaylists.map(p =>
            `<div class="dropdown-item" onclick="window.confirmAddToPlaylist(${p.id}, ${songId})">${p.name}</div>`
        ).join('');

        // ИСПРАВЛЕНО: передаем 'this' вместо '${songId}'
        container.innerHTML = `
            <div class="custom-dropdown">
                <div class="dropdown-selected" onclick="window.toggleDropdown(event, this)">
                    <span>🫧 + В плейлист</span>
                    <span>▼</span>
                </div>
                <div class="dropdown-menu" id="menu-${songId}">
                    ${menuItemsHtml}
                </div>
            </div>
        `;
    });
};

       // 4. Управление выпадающим списком
window.toggleDropdown = (event, element) => {
    if (event) event.stopPropagation();

    // Если вдруг пришло не то, пытаемся найти ближайший контейнер
    const container = (element && element.parentElement) ? element.parentElement : null;
    if (!container) return console.error("Контейнер не найден");

    const menu = container.querySelector('.dropdown-menu');
    if (!menu) return console.error("Меню не найдено");

    // Закрываем другие
    document.querySelectorAll('.dropdown-menu').forEach(m => {
        if (m !== menu) m.style.display = 'none';
    });

    // Переключаем текущее
    menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
};

window.confirmAddToPlaylist = (playlistId, songId) => {
    window.addToPlaylist(playlistId, songId);
    document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
};


    // 6. Открытие плейлиста
window.openPlaylist = (id) => {
    fetch(`${API_BASE}/playlist/${id}/songs`)
        .then(r => r.json())
        .then(data => {
            if (data.length === 0) return window.alert("Плейлист пуст 🫧");

            // Сохраняем песни в глобальный массив, чтобы плеер мог их играть
            songs = data.map(s => ({
                id: s.id,
                title: s.title,
                s3Url: s.s3Url,
                // Достаем обложку из альбома
                coverUrl: s.album ? s.album.coverUrl : '/img/default-cover.png',
                // Достаем имя артиста из вложенного объекта
                artist: (s.album && s.album.artist) ? s.album.artist.name : 'Unknown Artist'
            }));

            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';

            songs.forEach((s, index) => {
                const card = document.createElement('div');
                card.className = 'album-card';
                card.style = "background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 15px; transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between;";

                card.innerHTML = `
                    <div onclick="playSpecific(${index})" style="text-align: center;">
                        <img src="${s.coverUrl}"
                             style="width: 100%; border-radius: 15px; margin-bottom: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3);"
                             onerror="this.src='/img/default-cover.png'">
                        <h4 style="margin-bottom: 5px; font-size: 16px; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${s.title}</h4>
                        <p style="font-size: 12px; opacity: 0.7; color: white; margin-bottom: 10px;">${s.artist}</p>
                    </div>

                    <button onclick="window.removeFromPlaylist(${id}, ${s.id})"
                            style="width: 100%; background: linear-gradient(to bottom, rgba(255,75,43,0.3) 0%, rgba(255,0,0,0.2) 100%);
                                   color: #ff4b2b; border: 1px solid rgba(255,75,43,0.5); border-radius: 12px;
                                   padding: 8px; font-size: 11px; cursor: pointer; font-weight: 600;
                                   transition: 0.3s; backdrop-filter: blur(5px);"
                            onmouseover="this.style.background='rgba(255,75,43,0.5)'; this.style.color='white';"
                            onmouseout="this.style.background='rgba(255,75,43,0.2)'; this.style.color='#ff4b2b';">
                        🗑 Удалить
                    </button>
                `;
                grid.appendChild(card);
            });
        })
        .catch(err => console.error("Ошибка загрузки песен плейлиста:", err));
};
