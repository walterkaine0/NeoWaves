<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoWaves | Spotify Aero Edition</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://jsdelivr.net" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
</head>
<body>

<div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">NeoWaves</div>
        <nav class="menu">
            <div class="menu-item active" onclick="location.reload()">
                <span class="icon">🏠</span> Главная
            </div>
            <div class="menu-item">
                <span class="icon">🔍</span> Поиск
            </div>
        </nav>

        <div class="playlists-section">
            <p class="section-title">ПЛЕЙЛИСТЫ</p>
            <div th:each="pl : ${playlists}" class="playlist-item" style="display: flex; justify-content: space-between; align-items: center;">
                <span th:onclick="|openPlaylist(${pl.id})|" th:text="${pl.name == 'Favorites' ? '💎 ' + pl.name : '💿 ' + pl.name}" style="flex-grow: 1;"></span>

                <!-- Кнопка удаления (только если это не Favorites) -->
                <button th:if="${pl.name != 'Favorites'}"
                        th:onclick="|handleDeletePlaylist(${pl.id})|"
                        style="background:none; border:none; color: rgba(255,255,255,0.5); cursor:pointer; font-size: 18px; padding: 0 5px;">
                    ×
                </button>
            </div>
            <button class="add-playlist" onclick="handleCreatePlaylist()">+ Создать плейлист</button>
        </div>
    </aside>

    <!-- MAIN VIEW -->
    <main class="main-content">
        <header class="top-bar">
            <div class="auth-section" style="display: flex; justify-content: flex-end; width: 100%;">
                <span id="user-name" style="color: white; margin-right: 15px; font-weight: bold;"></span>
                <button id="login-btn" class="btn-frutiger" onclick="handleLogin()">Войти</button>
                <button id="logout-btn" class="btn-frutiger" onclick="handleLogout()" style="display:none;">Выйти</button>
            </div>
        </header>

        <section class="content">
            <div id="content-grid" class="album-grid">
                <!-- Сюда Thymeleaf рендерит песни при загрузке, а JS — при выборе плейлиста -->
                <div th:each="song, iter : ${songs}" class="album-card">
                    <div th:onclick="|playSpecific(${iter.index})|">
                        <img th:src="${song.album != null ? song.album.coverUrl : ''}" alt="Cover">
                        <h4 th:text="${song.title}"></h4>
                        <p th:text="${song.album != null && song.album.artist != null ? song.album.artist.name : 'Unknown'}"></p>
                    </div>

                    <!-- Кнопка добавления -->
                    <select class="add-to-pl" th:onchange="|addToPlaylist(this.value, ${song.id})|">
                        <option value="">+ В плейлист</option>
                        <option th:each="pl : ${playlists}" th:value="${pl.id}" th:text="${pl.name}"></option>
                    </select>
                </div>
            </div>
        </section>
    </main>

    <!-- PLAYER BAR -->
    <audio id="main-audio"></audio>

    <footer class="container-fluid fixed-bottom bg-dark text-white py-2 border-top border-secondary">
        <div class="row align-items-center">
            <!-- Лево: Трек -->
            <div class="col-3 d-flex align-items-center">
                <div class="bg-secondary rounded" style="width: 50px; height: 50px;"></div>
                <div class="ms-3">
                    <div class="fw-bold small">Track Title</div>
                    <div class="text-secondary small">Artist</div>
                </div>
            </div>
            <!-- Центр: Управление -->
            <div class="col-6 text-center">
                <div class="d-flex justify-content-center align-items-center gap-3 mb-1">
                    <button class="btn btn-link text-white p-0">⏮</button>
                    <button class="btn btn-light rounded-circle" style="width: 40px; height: 40px;">▶</button>
                    <button class="btn btn-link text-white p-0">⏭</button>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="small">0:00</span>
                    <input type="range" class="form-range" style="accent-color: #1db954;">
                    <span class="small">3:45</span>
                </div>
            </div>
            <!-- Право: Громкость -->
            <div class="col-3 text-end">
                <span class="me-2">❤</span>
                <input type="range" style="width: 80px;">
            </div>
        </div>
    </footer>
</div>

<!-- 1. ЛОГИКА ПЛЕЕРА И ПЛЕЙЛИСТОВ -->
<script th:inline="javascript">
    // 1. Формируем список песен из Thymeleaf
    let songs = [];
    /*[# th:each="s : ${songs}"]*/
    songs.push({
        id: [[${s.id}]],
        title: [[${s.title}]],
        s3Url: [[${s.s3Url}]],
        coverUrl: [[${s.album != null ? s.album.coverUrl : ''}]],
        artist: [[${s.album != null && s.album.artist != null ? s.album.artist.name : 'Unknown'}]]
    });
    /*[/]*/

    let currentIndex = 0;

    // 2. Инициализация плеера
    const audio = document.getElementById('main-audio');
    const pFill = document.getElementById('progress-fill');
    const pContainer = document.getElementById('progress-container');

    // Форматирование времени
    audio.ontimeupdate = () => {
    if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        pFill.style.width = pct + '%';
        document.getElementById('current-time').innerText = formatTime(audio.currentTime);
    }
};
    audio.onloadedmetadata = () => {
    document.getElementById('total-time').innerText = formatTime(audio.duration);
};
    pContainer.onclick = (e) => {
    const width = pContainer.clientWidth;
    const clickX = e.offsetX;
    audio.currentTime = (clickX / width) * audio.duration;
};
    function formatTime(s) {
    let min = Math.floor(s / 60);
    let sec = Math.floor(s % 60);
    return min + ":" + (sec < 10 ? '0' + sec : sec);
}

     // Обновление прогресса
    audio.ontimeupdate = () => {
        if (audio.duration) {
            const pct = (audio.currentTime / audio.duration) * 100;
            if (pFill) pFill.style.width = pct + '%';
            const curTime = document.getElementById('current-time');
            if (curTime) curTime.innerText = formatTime(audio.currentTime);
        }
    };


    // Загрузка данных трека в интерфейс
    function loadTrack(index) {
        if (!songs[index]) return;
        const s = songs[index];
        document.getElementById('track-title').innerText = s.title;
        document.getElementById('artist-name').innerText = s.artist;

        const miniCover = document.getElementById('mini-cover');
        if (miniCover) {
            miniCover.style.backgroundImage = `url('${s.coverUrl}')`;
            miniCover.style.backgroundSize = 'cover';
        }

        audio.src = s.s3Url;
        audio.load();
    }

    // 3. Управление (Глобальные функции)
    window.playSpecific = (i) => {
        currentIndex = i;
        loadTrack(i);
        audio.play();
        if (playBtn) playBtn.innerText = "⏸";
    };

    window.togglePlay = () => {
        if (!audio.src) return; // Если ничего не загружено
        if (audio.paused) {
            audio.play();
            if (playBtn) playBtn.innerText = "⏸";
        } else {
            audio.pause();
            if (playBtn) playBtn.innerText = "▶";
        }
    };

    window.nextTrack = () => {
        currentIndex = (currentIndex + 1) % songs.length;
        window.playSpecific(currentIndex);
    };

    window.prevTrack = () => {
        currentIndex = (currentIndex - 1 + songs.length) % songs.length;
        window.playSpecific(currentIndex);
    };

    // 4. Логика таймбара
    audio.ontimeupdate = () => {
        if (audio.duration) {
            const pct = (audio.currentTime / audio.duration) * 100;
            if (pFill) pFill.style.width = pct + '%';

            const curTimeEl = document.getElementById('current-time');
            if (curTimeEl) curTimeEl.innerText = formatTime(audio.currentTime);
        }
    };

    audio.onloadedmetadata = () => {
        const totalTimeEl = document.getElementById('total-time');
        if (totalTimeEl) totalTimeEl.innerText = formatTime(audio.duration);
    };

    if (pContainer) {
        pContainer.onclick = (e) => {
            const width = pContainer.clientWidth;
            const clickX = e.offsetX;
            if (audio.duration) {
                audio.currentTime = (clickX / width) * audio.duration;
            }
        };
    }

    // Автоматический переход к следующему треку
    audio.onended = () => { window.nextTrack(); };

    // ФУНКЦИЯ ОТКРЫТИЯ ПЛЕЙЛИСТА
    window.openPlaylist = (id) => {
    fetch(`/playlist/${id}/songs`)
        .then(r => r.json())
        .then(data => {
            if (data.length === 0) return alert("Плейлист пуст");

            // 1. Обновляем текущий список песен
            songs = data.map(s => ({
                id: s.id,
                title: s.title,
                s3Url: s.s3Url,
                coverUrl: s.album ? s.album.coverUrl : '',
                artist: (s.album && s.album.artist) ? s.album.artist.name : 'Unknown'
            }));

            // 2. Перерисовываем интерфейс (сетку)
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';

            songs.forEach((s, index) => {
                const card = document.createElement('div');
                card.className = 'album-card';
                // Теперь клик для проигрывания вешаем на обертку контента, а не на всю карту
                card.innerHTML = `
                    <div class="card-clickable" onclick="playSpecific(${index})">
                        <img src="${s.coverUrl}" alt="Cover">
                        <h4>${s.title}</h4>
                        <p>${s.artist}</p>
                    </div>
                    <button class="remove-btn" onclick="removeFromPlaylist(${id}, ${s.id})">
                        🗑 Удалить
                    </button>
                `;
                grid.appendChild(card);
            });

            loadTrack(0);
        })
        .catch(err => console.error("Ошибка загрузки плейлиста:", err));
};

    window.handleDeletePlaylist = (id) => {
    if (!confirm("Вы действительно хотите удалить этот плейлист?")) return;

    fetch(`/playlist/delete/${id}`, { method: 'POST' })
        .then(r => {
            if (r.ok) location.reload(); // Перезагружаем, чтобы обновить сайдбар
            else alert("Ошибка при удалении");
        });
};

// Не забудь добавить саму функцию удаления ниже
window.removeFromPlaylist = (playlistId, songId) => {
    if(!confirm("Удалить этот трек из плейлиста?")) return;

    fetch(`/playlist/${playlistId}/remove/${songId}`, { method: 'POST' })
        .then(r => r.text())
        .then(msg => {
            console.log(msg);
            openPlaylist(playlistId); // Обновляем вид плейлиста
        })
        .catch(err => alert("Ошибка при удалении"));
};

    window.handleLogin = () => console.log("Firebase инициализируется...");
    window.handleLogout = () => {};
    window.handleLike = () => alert("Войдите в аккаунт");
    window.handleCreatePlaylist = () => alert("Войдите в аккаунт");

    if (songs.length > 0) loadTrack(0);
</script>

<!-- 2. ЛОГИКА FIREBASE -->
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDJhWJDrW-rN2a3zFp_hAL5EWFn5UT9B28",
        authDomain: "neowaves-824c3.firebaseapp.com",
        projectId: "neowaves-824c3",
        storageBucket: "neowaves-824c3.firebasestorage.app",
        messagingSenderId: "398266414799",
        appId: "1:398266414799:web:f58c71fe879b531f8b29ba"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    window.handleLogin = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    // Мы используем только Popup, так как Redirect на localhost часто капризничает
    auth.signInWithPopup(provider)
        .then((result) => {
            console.log("Вход выполнен успешно!", result.user.displayName);
        })
        .catch((error) => {
            console.error("Ошибка входа:", error.message);
            alert("Не удалось открыть окно входа. Проверьте, не заблокированы ли всплывающие окна.");
        });
};

    window.handleLogout = () => {
    auth.signOut().then(() => {
        // Перенаправляем на чистый URL без параметров, чтобы контроллер не нашел email
        window.location.href = window.location.pathname;
    });
};

    window.handleLike = () => {
        const u = auth.currentUser;
        if(!u) return alert("Войдите в аккаунт!");
        fetch(`/like/${songs[currentIndex].id}?userEmail=${u.email}`, {method:'POST'})
            .then(r => r.text()).then(m => alert(m));
    };

    window.addToPlaylist = (playlistId, songId) => {
    if (!playlistId) return;

    fetch(`/playlist/${playlistId}/add/${songId}`, { method: 'POST' })
        .then(r => r.text())
        .then(message => {
            alert(message);
            // Сбрасываем селект в исходное состояние
            location.reload();
        });
};

    window.handleCreatePlaylist = () => {
        const u = auth.currentUser;
        if(!u) return alert("Войдите в аккаунт!");
        const n = prompt("Название плейлиста:");
        if(n) fetch(`/playlist/create?name=${encodeURIComponent(n)}&userEmail=${u.email}`, {method:'POST'})
            .then(r => {
                if(r.ok) location.reload(); // Перезагрузка страницы
                else alert("Ошибка создания");
            });
    };

    auth.onAuthStateChanged((user) => {
        if (user) {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('userEmail')) {
            window.location.search = `userEmail=${user.email}`;
            }
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'inline-block';
            document.getElementById('user-name').innerText = user.displayName;
            fetch('/api/auth/sync', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user.displayName, email: user.email})
            });
        }
    });

    const waveform = document.getElementById('waveform-container');
const barCount = 40; // Сколько полосок будет в волнорезе

// Генерируем полоски
for (let i = 0; i < barCount; i++) {
    const bar = document.createElement('div');
    bar.className = 'wave-bar';
    // Случайная высота для эффекта "записанного звука"
    const randomHeight = Math.floor(Math.random() * 40) + 15;
    bar.style.height = `${randomHeight}px`;
    waveform.appendChild(bar);
}

// Анимация прогресса (подсветка синим)
audio.addEventListener('timeupdate', () => {
    const progress = audio.currentTime / audio.duration;
    const activeBarIndex = Math.floor(progress * barCount);

    const bars = waveform.getElementsByClassName('wave-bar');
    for (let i = 0; i < bars.length; i++) {
        if (i <= activeBarIndex) {
            bars[i].classList.add('active');
        } else {
            bars[i].classList.remove('active');
        }
    }
});

// Клик по волне для перемотки
waveform.addEventListener('click', (e) => {
    const rect = waveform.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const percentage = x / rect.width;
    audio.currentTime = percentage * audio.duration;
});

</script>
</body>
</html>
