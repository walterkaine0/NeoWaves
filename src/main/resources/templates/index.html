<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoWaves | Spotify Aero Edition</title>
    <script src="https://tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://jsdelivr.net" rel="stylesheet">


    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
</head>
<body>
<audio id="main-audio"></audio>

<footer class="player-wrapper-aero fixed-bottom border-top border-white border-opacity-25">
    <div class="container-fluid h-100">
        <div class="row h-100 align-items-center px-4">

            <!-- ЛЕВО: Трек -->
            <div class="col-3 d-flex align-items-center">
                <div id="mini-cover" class="rounded-3 shadow-sm bg-secondary" style="width: 56px; height: 56px; background-size: cover;"></div>
                <div class="ms-3 overflow-hidden">
                    <div id="track-title" class="fw-bold text-white text-truncate" style="font-size: 14px;">Выберите трек</div>
                    <div id="artist-name" class="text-white-50 small text-truncate">...</div>
                </div>
            </div>

            <!-- ЦЕНТР: Плеер -->
            <div class="col-6 d-flex flex-column align-items-center">
                <div class="d-flex align-items-center gap-4 mb-2">
                    <button class="btn btn-link text-white p-0 fs-4 text-decoration-none" onclick="prevTrack()">⏮</button>
                    <button id="play-btn" class="btn-play-aero" onclick="togglePlay()">▶</button>
                    <button class="btn btn-link text-white p-0 fs-4 text-decoration-none" onclick="nextTrack()">⏭</button>
                </div>

                <div class="d-flex align-items-center w-100 gap-2">
                    <span id="current-time" class="text-white-50" style="font-size: 11px; min-width: 35px;">0:00</span>
                    <div id="progress-container" class="progress-container-custom flex-grow-1">
                        <div id="progress-fill" class="progress-fill-custom"></div>
                    </div>
                    <span id="total-time" class="text-white-50" style="font-size: 11px; min-width: 35px;">0:00</span>
                </div>
            </div>

            <!-- ПРАВО: Громкость -->
            <div class="col-3 d-flex justify-content-end align-items-center gap-3">
                <button class="btn btn-link text-white p-0 fs-4 text-decoration-none" onclick="handleLike()">❤</button>
                <input type="range" class="form-range d-none d-md-block" style="width: 100px; accent-color: #00fff2;">
            </div>

        </div>
    </div>
</footer>
<script>
    const audio = document.getElementById('main-audio');
    const pFill = document.getElementById('progress-fill');
    const pContainer = document.getElementById('progress-container');

    audio.ontimeupdate = () => {
        if (audio.duration) {
            const pct = (audio.currentTime / audio.duration) * 100;
            pFill.style.width = pct + '%';
            document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        }
    };

    pContainer.onclick = (e) => {
        const width = pContainer.clientWidth;
        const clickX = e.offsetX;
        audio.currentTime = (clickX / width) * audio.duration;
    };

    function formatTime(s) {
        let min = Math.floor(s / 60);
        let sec = Math.floor(s % 60);
        return min + ":" + (sec < 10 ? '0' + sec : sec);
    }
</script>

</body>
</html>
