<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoWaves | Spotify Aero Edition</title>
    <script src="https://tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
</head>
<body>
<footer class="fixed bottom-0 left-0 w-full h-24 bg-black/40 backdrop-blur-xl border-t border-white/10 px-6 flex items-center justify-between z-50">

    <!-- 1. ЛЕВО: Информация о треке -->
    <div class="flex items-center w-1/4">
        <div id="mini-cover" class="w-14 h-14 bg-gray-800 rounded-lg shadow-2xl bg-cover bg-center"></div>
        <div class="ml-4">
            <div id="track-title" class="text-white text-sm font-bold truncate w-40">Выберите трек</div>
            <div id="artist-name" class="text-gray-400 text-xs mt-1">...</div>
        </div>
    </div>

    <!-- 2. ЦЕНТР: Управление и прогресс -->
    <div class="flex flex-col items-center w-2/4 max-w-2xl">
        <!-- Кнопки -->
        <div class="flex items-center gap-6 mb-2">
            <button onclick="prevTrack()" class="text-gray-400 hover:text-white transition"><i class="fas fa-step-backward text-xl"></i>⏮</button>
            <button id="play-btn" onclick="togglePlay()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center hover:scale-105 transition shadow-lg text-black">
                ▶
            </button>
            <button onclick="nextTrack()" class="text-gray-400 hover:text-white transition"><i class="fas fa-step-forward text-xl"></i>⏭</button>
        </div>
        <!-- Полоска прогресса (Spotify Style) -->
        <div class="flex items-center w-full gap-3 text-[10px] text-gray-400">
            <span id="current-time">0:00</span>
            <div id="progress-container" class="group relative flex-grow h-1 bg-white/20 rounded-full cursor-pointer">
                <div id="progress-fill" class="h-full bg-[#1db954] rounded-full w-0 group-hover:bg-[#1ed760] transition-all"></div>
                <!-- Ползунок при наведении -->
                <div class="absolute top-1/2 -translate-y-1/2 right-0 w-3 h-3 bg-white rounded-full shadow-md opacity-0 group-hover:opacity-100 transition-opacity"></div>
            </div>
            <span id="total-time">0:00</span>
        </div>
    </div>

    <!-- 3. ПРАВО: Дополнительные действия -->
    <div class="flex items-center justify-end w-1/4 gap-4">
        <button onclick="handleLike()" class="text-gray-400 hover:text-red-500 transition">❤</button>
        <div class="flex items-center gap-2 w-32">
            <span class="text-gray-400">🔈</span>
            <div class="h-1 bg-white/20 rounded-full flex-grow cursor-pointer">
                <div class="h-full bg-white rounded-full w-1/2"></div>
            </div>
        </div>
    </div>
</footer>
<script>
    const audio = document.getElementById('main-audio');
    const pFill = document.getElementById('progress-fill');
    const pContainer = document.getElementById('progress-container');

    audio.ontimeupdate = () => {
        if (audio.duration) {
            const pct = (audio.currentTime / audio.duration) * 100;
            pFill.style.width = pct + '%';
            document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        }
    };

    pContainer.onclick = (e) => {
        const width = pContainer.clientWidth;
        const clickX = e.offsetX;
        audio.currentTime = (clickX / width) * audio.duration;
    };

    function formatTime(s) {
        let min = Math.floor(s / 60);
        let sec = Math.floor(s % 60);
        return min + ":" + (sec < 10 ? '0' + sec : sec);
    }
</script>

</body>
</html>
